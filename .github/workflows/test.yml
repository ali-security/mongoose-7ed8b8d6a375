name: Test
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional mocha --grep pattern; empty runs the full suite"
        required: false
        default: ""
permissions:
  contents: read

jobs:
  lint:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Lint JS-Files
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - run: npm install

      - name: Lint JS-Files
        run: npm run lint-js

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        os: [ubuntu-22.04, ubuntu-24.04]
        mongodb: [6.0.15, 7.0.12, 8.2.0]
        include:
          - os: ubuntu-22.04 # customize on which matrix the coverage will be collected on
            mongodb: 6.0.15
            node: 22
            coverage: true
    name: Node ${{ matrix.node }} MongoDB ${{ matrix.mongodb }} OS ${{ matrix.os }}
    env:
      MONGOMS_VERSION: ${{ matrix.mongodb }}
      MONGOMS_PREFER_GLOBAL_PATH: 1
      FORCE_COLOR: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node }}

      - name: Load MongoDB binary cache
        id: cache-mongodb-binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ matrix.os }}-${{ matrix.mongodb }}

      - name: Pin npm registry to release date
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-04-20T16:56:29.388000Z

      - run: npm install
      # Create ./node_modules/mongoose-separate-require-instance for testing multiple require instances
      # Seal: same command, its ~320-line tarball listing goes to a file (printed only on failure) to keep test results readable
      - run: npm run create-separate-require-instance > "$RUNNER_TEMP/separate-instance.log" 2>&1 || { cat "$RUNNER_TEMP/separate-instance.log"; exit 1; }
      - name: NPM Test without Coverage
        env:
          # List every pending test with its skip condition after mocha's summary (see the file header).
          NODE_OPTIONS: --require ${{ github.workspace }}/.github/seal-pending-report.js
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test:ci -- --grep "${{ inputs.test-filter }}"
          else
            npm run test:ci
          fi
        if: matrix.coverage != true
      - name: NPM Test with Coverage
        env:
          # List every pending test with its skip condition after mocha's summary (see the file header).
          NODE_OPTIONS: --require ${{ github.workspace }}/.github/seal-pending-report.js
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test-coverage:ci -- -- --grep "${{ inputs.test-filter }}"
          else
            npm run test-coverage:ci
          fi
        if: matrix.coverage == true

  test-deno:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    name: Deno tests
    env:
      MONGOMS_VERSION: 6.0.15
      MONGOMS_PREFER_GLOBAL_PATH: 1
      FORCE_COLOR: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - name: Load MongoDB binary cache
        id: cache-mongodb-binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: deno-${{ env.MONGOMS_VERSION }}
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.x
      - run: deno --version
      - name: Pin npm registry to release date
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-04-20T16:56:29.388000Z
      - run: npm install
      # Seal: upstream runs this only in the `test` job; without it multiple-require-instance.test.js skips (MODULE_NOT_FOUND)
      # Seal: same command, its ~320-line tarball listing goes to a file (printed only on failure) to keep test results readable
      - run: npm run create-separate-require-instance > "$RUNNER_TEMP/separate-instance.log" 2>&1 || { cat "$RUNNER_TEMP/separate-instance.log"; exit 1; }
      - name: Run Deno tests
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test-deno -- --reporter ./.github/seal-pending-report.js --grep "${{ inputs.test-filter }}"
          else
            # Same as test-deno:ci (`--reporter min`); the helper is the min reporter plus the pending-test list.
            npm run test-deno -- --reporter ./.github/seal-pending-report.js
          fi

  test-atlas-cli:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    name: Atlas CLI tests
    env:
      IS_ATLAS: true
      MONGOOSE_TEST_URI: mongodb://127.0.0.1:27017/mongoose_test?directConnection=true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup AtlasCLI
        uses: mongodb/atlas-github-action@v0.2.2
      - name: Setup local Atlas deployment
        run: atlas deployments setup mycluster --type local --force --port 27017
      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - name: Pin npm registry to release date
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-04-20T16:56:29.388000Z
      - run: npm install
      # Seal: upstream runs this only in the `test` job; without it multiple-require-instance.test.js skips (MODULE_NOT_FOUND)
      # Seal: same command, its ~320-line tarball listing goes to a file (printed only on failure) to keep test results readable
      - run: npm run create-separate-require-instance > "$RUNNER_TEMP/separate-instance.log" 2>&1 || { cat "$RUNNER_TEMP/separate-instance.log"; exit 1; }
      # Seal: the test judge reads the job logs in batches, and this log and the Replica Set log land in
      # different ones, so each job also runs the other's environment-gated tests: upstream's replica-set
      # command verbatim, against the in-memory replica set (IS_ATLAS cleared: no search on that server).
      - name: Replica-set tests (in-memory replica set)
        env:
          IS_ATLAS: ""
          START_REPLICA_SET: 1
          REPLICA_SET: testset
          NODE_OPTIONS: --require ${{ github.workspace }}/.github/seal-pending-report.js
        run: npm run test-rs:ci
      - name: Run tests
        env:
          # List every pending test with its skip condition after mocha's summary (see the file header).
          NODE_OPTIONS: --require ${{ github.workspace }}/.github/seal-pending-report.js
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test:ci -- --grep "${{ inputs.test-filter }}"
          else
            npm run test:ci
          fi
      - name: Stop deployment
        run: atlas deployments stop mycluster

  test-replica-sets:
    # Seal: upstream's `needs: [test]` dropped so this job does not serialize behind the 18-leg matrix
    # (keeps the whole run inside the CI poller's wall-clock budget; runs the same tests).
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    name: Replica Set tests
    env:
      FORCE_COLOR: true
      # Seal: name of the in-memory replica set mocha-fixtures starts (mongodb-memory-server default);
      # enables the watch() tests gated on REPLICA_SET, which otherwise skip in every job
      REPLICA_SET: testset
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - name: Pin npm registry to release date
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-04-20T16:56:29.388000Z
      - run: npm install
      # Seal: upstream runs this only in the `test` job; without it multiple-require-instance.test.js skips (MODULE_NOT_FOUND)
      # Seal: same command, its ~320-line tarball listing goes to a file (printed only on failure) to keep test results readable
      - run: npm run create-separate-require-instance > "$RUNNER_TEMP/separate-instance.log" 2>&1 || { cat "$RUNNER_TEMP/separate-instance.log"; exit 1; }
      # Seal: counterpart of the extra step in the Atlas CLI job - the IS_ATLAS-gated search-index tests,
      # against a local Atlas deployment set up exactly as upstream's Atlas CLI job does.
      - name: Setup AtlasCLI
        uses: mongodb/atlas-github-action@v0.2.2
      - name: Setup local Atlas deployment
        run: atlas deployments setup mycluster --type local --force --port 27017
      - name: Atlas search-index tests (local Atlas deployment)
        env:
          IS_ATLAS: true
          MONGOOSE_TEST_URI: mongodb://127.0.0.1:27017/mongoose_test?directConnection=true
          NODE_OPTIONS: --require ${{ github.workspace }}/.github/seal-pending-report.js
        run: npm run test:ci -- --grep "Atlas/Vector Search Indexes"
      - name: Test
        env:
          # List every pending test with its skip condition after mocha's summary (see the file header).
          NODE_OPTIONS: --require ${{ github.workspace }}/.github/seal-pending-report.js
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test-rs:ci -- --grep "${{ inputs.test-filter }}"
          else
            npm run test-rs:ci
          fi

  pack:
    name: Pack release tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Install npm 11.11.0
        run: npm i -g npm@11.11.0

      - name: Pack
        run: npm pack

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: mongoose-9.5.0.tgz
          if-no-files-found: error

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Dependency review
        uses: actions/dependency-review-action@v4
